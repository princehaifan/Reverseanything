[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API requests go to the Express app running as a function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page app: every other path is handled by the client router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
